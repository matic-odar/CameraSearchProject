name: Search Tracker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: search-tracker-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Preferred path: EAS "preview" profile (buildType apk), built on this runner with your Expo account.
      - name: Set up EAS
        if: env.EXPO_TOKEN != ''
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK with EAS (local, preview profile)
        if: env.EXPO_TOKEN != ''
        run: |
          # Links/creates the EAS project for this runner's checkout if app.json has no projectId yet.
          eas init --non-interactive --force
          eas build --platform android --profile preview --local --non-interactive --output "$GITHUB_WORKSPACE/search-tracker.apk"

      # Fallback path when no EXPO_TOKEN secret is set: plain Gradle release build (debug-signed, installable).
      - name: Build APK with Gradle (no EXPO_TOKEN)
        if: env.EXPO_TOKEN == ''
        run: |
          npx expo prebuild --platform android --no-install --clean
          cd android
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/search-tracker.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: search-tracker-apk
          path: search-tracker.apk
          if-no-files-found: error
          retention-days: 30
